<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Outreach Email — Atlanta Area</title>
<style>
  :root { --ink:#1c2321; --ink-soft:#4a534f; --paper:#fbfaf6; --panel:#fff; --line:#d8d3c4; --accent:#2f5d4f; --accent-soft:#e7efe9; }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 20px; background:var(--paper); color:var(--ink); font-family:Georgia,serif; }
  .sheet { max-width:680px; margin:0 auto; background:var(--panel); border:1px solid var(--line); padding:44px 48px; }
  header { border-bottom:3px solid var(--accent); padding-bottom:16px; margin-bottom:26px; }
  header h1 { font-size:22px; margin:0; color:var(--accent); }
  header .tag { font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--ink-soft); margin-top:6px; }
  .field { display:flex; flex-direction:column; gap:4px; margin-bottom:16px; }
  label { font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); }
  input[type=email], input[type=text] {
    font-family:inherit; font-size:15px; border:none; border-bottom:1px solid var(--line);
    background:transparent; padding:6px 2px; width:100%;
  }
  input:focus, textarea:focus { outline:none; border-bottom:1.5px solid var(--accent); background:var(--accent-soft); }
  textarea {
    font-family:Georgia,serif; font-size:15px; line-height:1.6; color:var(--ink); width:100%;
    min-height:340px; border:1px solid var(--line); border-radius:4px; padding:16px; resize:vertical;
  }
  .actions { margin-top:24px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  button { font-family:'Helvetica Neue',Arial,sans-serif; font-size:14px; font-weight:600; padding:13px 26px; border:none; border-radius:3px; cursor:pointer; }
  #submitBtn { background:var(--accent); color:#fff; }
  #submitBtn:hover { background:#234a3f; }
  .status { font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; color:var(--ink-soft); }
  .required-note { font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px; color:var(--ink-soft); margin-top:6px; }
  @media (max-width:640px) { .sheet { padding:26px 20px; } }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <h1>Vendor Outreach — Atlanta Area</h1>
    <div class="tag">Saneca</div>
  </header>

  <div class="field">
    <label for="toEmail">To</label>
    <input type="email" id="toEmail" placeholder="contractor@example.com">
  </div>

  <div class="field">
    <label for="subject">Subject</label>
    <input type="text" id="subject" value="Insured Post-Construction Cleaning — Atlanta Area Vendor Introduction">
  </div>

  <div class="field">
    <label for="body">Message (edit placeholders like [Business Name], [Phone], [Email] before sending)</label>
    <textarea id="body">Hello,

My name is Saneca Mack with [Business Name]. We provide insured post-construction final cleaning services for builders, remodelers, and property professionals throughout the Atlanta area.

We help contractors prepare properties for final walkthroughs and client handoff by handling:
- Construction dust removal
- Detailed surface cleaning
- Kitchen and bathroom final cleaning
- Floor preparation
- Final touch-ups before delivery

I'm reaching out to see if we can be added to your preferred vendor/subcontractor list for upcoming projects.

Would you be open to a quick conversation about how we can support your team?

Thank you,

Saneca Mack
[Phone]
[Email]</textarea>
  </div>

  <div class="actions">
    <button type="button" id="submitBtn">Send via Email</button>
    <span class="status" id="statusMsg"></span>
  </div>
  <p class="required-note">Fill in the "To" field and edit the bracketed placeholders, then send — this opens your email app with everything pre-filled.</p>
</div>

<script>
  document.getElementById('submitBtn').addEventListener('click', () => {
    const to = document.getElementById('toEmail').value.trim();
    if (!to) {
      document.getElementById('statusMsg').textContent = "Enter a recipient email first.";
      return;
    }
    const subject = document.getElementById('subject').value.trim();
    const body = document.getElementById('body').value;
    const mailto = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
    document.getElementById('statusMsg').textContent = "Opening your email app…";
  });
</script>
</body>
</html>
